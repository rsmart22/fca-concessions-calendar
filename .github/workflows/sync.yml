name: Sync MaxPreps schedule
on:
  schedule:
    - cron: "7 * * * *"      # hourly, at :07
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4
      - run: python maxpreps_sync.py
        env:
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
      - name: Commit if changed
        if: always()
        run: |
          git config user.name "schedule-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/concessions.ics state.json
          git add failures.json 2>/dev/null || true
          if [ -n "$(git diff --cached -I'^DTSTAMP')" ]; then
            git commit -m "Schedule update"
            git push
          else
            echo "No changes"
          fi
